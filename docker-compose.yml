# TradeX local development stack.
#
# MySQL is exposed on 3307 (not 3306) so it never collides with a MySQL you may
# already run on your machine. The backend's default application.yml points here.
#
#   docker compose up -d
#   docker compose logs -f mysql
#
# The volume keeps data between restarts. Remove it with:
#   docker compose down -v
services:
  mysql:
    image: mysql:8.4
    container_name: tradex-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-tradex-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tradex}
      MYSQL_USER: ${MYSQL_USER:-tradex}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-tradex}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    volumes:
      - tradex-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-tradex-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  tradex-mysql-data:
