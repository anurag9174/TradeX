# =====================================================================================
# TradeX :: automated-test profile
#
# Runs the real Spring context against in-memory H2 in MySQL compatibility mode. The
# Flyway migrations in db/migration are written portably on purpose, so the exact schema
# and seed data that MySQL gets in development are also what the tests exercise.
# =====================================================================================

spring:
  datasource:
    url: jdbc:h2:mem:tradex_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=15000
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      pool-name: tradex-test-pool
      maximum-pool-size: 8
      minimum-idle: 1

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Validation is intentionally relaxed under H2 because its type
      # introspection differs from MySQL's; ddl-auto=validate runs against the real database.
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        query:
          in_clause_parameter_padding: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    serialization:
      write-dates-as-timestamps: false

tradex:
  trading:
    initial-balance: 100000.00
    minimum-initial-balance: 100.00
    maximum-initial-balance: 1000000.00
    default-account-currency: INR
    currency: INR
    # Fixed nominal rate so USD-instrument tests assert exact conversions.
    fx-rates:
      USD: 80.00
    # The matching engine bean stays alive so tests can drive its passes explicitly, but its
    # scheduler is pushed an hour out so nothing fires behind the tests' backs.
    matching-enabled: true
    matching-interval-millis: 3600000
    matching-initial-delay-millis: 3600000
    auto-trigger-attached-levels: true
    allow-protective-exits-when-blocked: true
    always-open: true
    trading-zone: Asia/Kolkata
    market-order-slippage-bps: 0
    charges:
      brokerage-percent: 0.03
      brokerage-cap: 20.00
      exchange-txn-percent: 0.00325
      sebi-percent: 0.0001
      gst-percent: 18.00
      stamp-duty-percent: 0.015
      dp-charge-per-sell: 13.50
      rounding-step: 0.01

  marketdata:
    # Always the deterministic generated feed: tests never touch a live provider.
    mode: simulated
    # 400 days of history for 15 instruments adds minutes of startup for no test value.
    bootstrap-enabled: false
    persist-candles: false
    simulated-tick-millis: 600000
    quote-poll-seconds: 3600
    candle-refresh-seconds: 3600

  security:
    jwt-secret: tradex-test-secret-0123456789-0123456789-0123456789
    jwt-expiry-minutes: 60
    issuer: tradex-test
    allowed-origins: http://localhost:5173
    # Tests register many throwaway users; the per-IP bucket would throttle them.
    rate-limit:
      enabled: false
      capacity: 100000
      window-seconds: 1
      auth-capacity: 100000
      auth-window-seconds: 1
    seed-demo-user: false

logging:
  level:
    root: warn
    com.tradex: info
    org.springframework: warn
    org.hibernate: warn
